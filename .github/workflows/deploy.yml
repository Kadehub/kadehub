name: Build and Deploy KadeHub

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: nethun/dev:kadehub-be
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: nethun/dev:kadehub-fe
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: self-hosted

    steps:
      - name: Deploy to Server via SSH
        run: |
          ssh deploy@10.1.2.14 << 'EOF'
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker pull nethun/dev:kadehub-be
            docker pull nethun/dev:kadehub-fe

            docker stop kadehub-be kadehub-fe || true
            docker rm kadehub-be kadehub-fe || true

            docker run -d --name kadehub-be \
              --env-file /home/deploy/AppData/KadeHub/Env/dev.env \
              -e NODE_ENV=production \
              -e PORT=3001 \
              --network kadehub-network \
              --restart unless-stopped \
              nethun/dev:kadehub-be

            docker run -d --name kadehub-fe \
              -p 3000:3000 \
              --network kadehub-network \
              --restart unless-stopped \
              nethun/dev:kadehub-fe

            docker image prune -f

            sleep 5
            docker ps | grep kadehub
            echo "Backend logs:"
            docker logs kadehub-be --tail 20
            echo "Frontend logs:"
            docker logs kadehub-fe --tail 20
          EOF
